name: PR CI

# `stt` and `nlp` have no lint/test tooling today (no pyproject, no test
# suite) and are intentionally left out here — a real check for `nlp`
# specifically would require the same slow from-source llama-cpp-python
# compile the tag-triggered image workflow already has to pay for, just
# moved into every PR instead of only at release time. Adding real coverage
# for those two services is a separate, later task.

on:
  pull_request:
    branches:
      - '**'

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # No unit test script exists yet — the production build itself
      # (tsc -b && vite build) already doubles as the typecheck gate.
      - name: Build (typecheck + production build)
        run: npm run build

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Filesystem scan at repo root auto-discovers all manifests
      # (backend/pyproject.toml, frontend/package-lock.json,
      # stt/requirements.txt, nlp/requirements.txt) in one pass.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
