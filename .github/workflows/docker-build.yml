name: Docker build

# Publishes all 4 service images (api/frontend/stt/nlp) to GHCR on a version
# tag, using the same RC -> validated-promote pattern as derby/server's own
# docker-build.yml — but with no CD step: this app has nothing to deploy to,
# it's self-hosted per household via docker-compose.yml on whoever runs it.
#
# linux/amd64 and linux/arm64 are both built *natively*, on their own
# runner, never through QEMU emulation: nlp's Dockerfile already documents
# that compiling llama-cpp-python from source can OOM a small build host
# even on its native arch, so emulating that compile for the other arch
# would be far worse. Each per-arch image is pushed by digest only (no tag
# yet), then merged into one multi-arch manifest list — see build-rc and
# merge-rc below. If ubuntu-24.04-arm ever isn't available on this account,
# the fallback is docker/setup-qemu-action + a single linux/amd64,linux/arm64
# build per service instead of this two-job split.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'

permissions:
  contents: read
  packages: write

jobs:
  build-rc:
    if: contains(github.ref_name, '-rc')
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, stt, nlp]
        platform: [linux/amd64, linux/arm64]
        include:
          - service: api
            context: backend
            file: backend/Dockerfile
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
          - service: stt
            context: stt
            file: stt/Dockerfile
          - service: nlp
            context: nlp
            file: nlp/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}. Expected v<semver>-rc<n>"
            exit 1
          fi

      # GHCR requires an all-lowercase repository path; this repo's owner
      # (tomFregonese) is not, so it can't be used as-is like
      # ghcr.io/${{ github.repository }}.
      - name: Compute image name and platform slug
        run: |
          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push-by-digest, no tag yet: this per-arch image is an intermediate
      # artifact, only merge-rc's imagetools call below turns it into
      # something anyone would actually pull.
      #
      # APP_VERSION is only meaningful for `api` (see backend/Dockerfile and
      # app/config.py — it's what /api/health reports and what the
      # frontend's update-check banner compares against GitHub's latest
      # release). An empty/unused build-arg on the other 3 services is a
      # harmless BuildKit warning, not a failure.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ matrix.service == 'api' && github.ref_name || '' }}
          outputs: type=image,name=${{ env.IMAGE_BASE }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ env.PLATFORM_SLUG }}

      # ignore-unfixed: a CVE with no fix published yet by the upstream
      # maintainer (Debian/Alpine/PyPI) can't be acted on no matter how the
      # gate is set — failing on it forever just blocks every release
      # indefinitely. Only a CVE we could actually resolve (bump a base
      # image or a dependency) fails the build.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-rc:
    if: contains(github.ref_name, '-rc')
    needs: build-rc
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, stt, nlp]

    steps:
      - name: Set env based on tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Compute image name
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests for this service
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Combines the amd64 + arm64 digests built above into one multi-arch
      # manifest list, tagged both with the RC version and the rolling
      # latest-rc tag. No rebuild: this is the exact same image bytes that
      # were already Trivy-scanned per arch in build-rc.
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE_NAME="${{ env.IMAGE_BASE }}/${{ matrix.service }}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            --tag "${IMAGE_NAME}:latest-rc" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

  find-rc-tag:
    if: "!contains(github.ref_name, '-rc')"
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.find.outputs.rc_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}. Expected v<semver>"
            exit 1
          fi

      # A final tag can only ever promote an RC that already went through
      # build-rc's Trivy gate for every arch — never a fresh rebuild of
      # whatever the commit currently contains.
      - name: Find RC tag to promote
        id: find
        run: |
          TAG="${GITHUB_REF_NAME}"
          RC_TAG=$(git tag --points-at "${GITHUB_SHA}" | grep -E "^${TAG}-rc[0-9]+$" | sort -V | tail -n1)
          if [[ -z "${RC_TAG}" ]]; then
            echo "No RC tag matching ${TAG}-rcN points at commit ${GITHUB_SHA}. Refusing to promote an unvalidated image."
            exit 1
          fi
          echo "Promoting RC tag: ${RC_TAG}"
          echo "rc_tag=${RC_TAG}" >> "$GITHUB_OUTPUT"

  promote-final:
    needs: find-rc-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, stt, nlp]

    steps:
      - name: Set env based on tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Compute image name
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pure retag of the already-multi-arch, already-scanned RC manifest
      # list — no rebuild, no new Trivy run.
      - name: Promote RC image to final tag
        run: |
          IMAGE_NAME="${{ env.IMAGE_BASE }}/${{ matrix.service }}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ needs.find-rc-tag.outputs.rc_tag }}"

  # Builds the zero-git-clone end-user download: zips up release/ (a
  # pull-only compose file + double-clickable launcher scripts, see that
  # directory's own README.txt) and attaches it to a GitHub Release for this
  # tag. No `-rc` filter needed here — this job needs promote-final, which
  # needs find-rc-tag (skipped on any `-rc` tag), so it's skipped too via the
  # same chain.
  package-release:
    needs: promote-final
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Constant filename on purpose (not versioned) — this is what makes
      # GitHub's stable alias URL work:
      #   .../releases/latest/download/whats-in-your-fridge.zip
      # That link always resolves to whichever release is currently
      # "latest" and downloads the asset directly, no repo page, no
      # browsing Releases, no git — just like clicking a download button
      # on any normal website. Sharing that one URL with a non-technical
      # friend is the whole point; a versioned filename would break it on
      # every new release.
      - name: Build release package
        run: |
          (cd release && zip -r "../whats-in-your-fridge.zip" .)

      - name: Create GitHub Release with the package attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" "whats-in-your-fridge.zip" \
            --title "${TAG}" \
            --generate-notes
