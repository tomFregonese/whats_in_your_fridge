# Reverse-proxies /api/* to the backend service on Docker's internal
# network. This is the only entry point published to the host (bound to
# 127.0.0.1 in docker-compose.yml) — the backend itself publishes no port.
server {
    listen 80;

    # By default nginx resolves a hostname used directly in `proxy_pass`
    # exactly once, at config load time, and caches that IP forever — if
    # `api` is later rebuilt/restarted on its own (a normal, frequent
    # workflow: backend-only changes don't touch `frontend`), it gets a
    # new address on Docker's internal network and this container starts
    # returning 502 for every request until `frontend` itself is restarted
    # too. Routing `proxy_pass` through a variable forces a fresh DNS
    # lookup against Docker's embedded resolver (127.0.0.11) on every
    # request instead (bounded by `valid=10s` so it isn't literally
    # per-request), so `api` restarting alone never breaks this proxy.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Deliberately not a literal path after the variable — when
        # `proxy_pass` uses a variable, nginx stops doing its usual
        # location-prefix substitution, so appending `$request_uri`
        # (the exact original path, e.g. `/api/health`) is what keeps
        # this equivalent to the original static `proxy_pass
        # http://api:8000/api/;` — omitting it would silently drop the
        # `/api` prefix and 404 against the backend.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # nginx's own default (60s) can be shorter than a `:free`
        # OpenRouter call legitimately takes, cutting the connection with
        # nginx's own "504 Gateway Time-out" — a plain HTML page, not our
        # app's own error handling — before the backend ever gets to
        # respond. SSE endpoints (suggestions, dictation) sidestep this
        # entirely by streaming chunks, which resets this timer on every
        # chunk, but this floor stays generous for any request that isn't
        # (or a chunk that's slow to arrive).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
