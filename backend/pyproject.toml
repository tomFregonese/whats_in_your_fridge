[project]
name = "whats-in-your-fridge-backend"
version = "0.1.0"
description = "Backend API for What's in your fridge?"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "cryptography>=43.0",
    "httpx>=0.27",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated revision scripts follow Alembic's own template/style,
# not ours, and are never hand-edited — excluded rather than fought.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI relies on calling `Depends(...)` as an argument default —
# the idiomatic pattern, not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions"]
